SOURCE: CT
TARGET: MR
NUM_WORKERS: 4
FULLY_SUPERVISED: False
TRAIN:
  warmup_epoch: 100
  DA_METHOD: oursmmwhs
  MODEL: DeepLabv2
  RESTORE_FROM:  DeepLab_resnet_pretrained_imagenet.pth
  D_AUX_RESTORE: MPSCL_Pretrained_Model/training/ct2mr_model_pretrained_D_aux.pth # MPSCL_Pretrained_Model/training/ct2mr_model_pretrained_D_aux.pth
  D_MAIN_RESTORE: MPSCL_Pretrained_Model/training/ct2mr_model_pretrained_D_main.pth # MPSCL_Pretrained_Model/training/ct2mr_model_pretrained_D_main.pth

  CLASS_CENTER_FEA_INIT_TRG: MPSCL_Pretrained_Model/training/ct2mr_class_center_feas_init.npy
  CLASS_CENTER_FEA_INIT_SRC: MPSCL_Pretrained_Model/training/mr2ct_class_center_feas_init.npy
  #CLASS_CENTER_FEA_INIT: MPSCL_Pretrained_Model/training/ct2mr_class_center_feas_init.npy
  D_TYPE:         PatchGAN
  D_NORM:          Batch_Norm
  MULTI_LEVEL: True
  LAMBDA_ADV_MAIN:      0.003
  LAMBDA_ADV_AUX:       0.00002
  LAMBDA_MPCL_SRC:       1.0
  LAMBDA_MPCL_TRG:       0.1
  CLASS_CENTER_M:       0.01
  PIXEL_SEL_TH:  0.25

  SRC_TEMP:      2.0
  SRC_BASE_TEMP: 1.0
  TRG_TEMP:      1.0
  TRG_BASE_TEMP: 1.0
  SRC_MARGIN:    0.2
  TRG_MARGIN:    0.2

  LAMBDA_DICE_SRC_MAIN:   1.0
  LAMBDA_DICE_SRC_AUX:    0.1
  feature_enhance_type: dmfe
  consistency_aug_type: wavelet
  fourier_aug_strength: 0.1
  experiment_name: dmwcc_feature-dmfe_cons-wavelet

TEST:
  MODE: best
